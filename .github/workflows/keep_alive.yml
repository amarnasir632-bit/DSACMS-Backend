name: Keep Supabase Alive

on:
  schedule:
    # يعمل كل 3 أيام الساعة 12 ظهراً
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -i -X GET 'https://qhjlptuomqoxlmgixhdg.supabase.co/rest/v1/materials?select=id&limit=1' \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"